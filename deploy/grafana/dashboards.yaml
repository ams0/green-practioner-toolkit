apiVersion: v1
kind: ConfigMap
metadata:
  name: green-practitioner-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  green-practitioner.json: |
    {
      "dashboard": {
        "title": "Green Practitioner - Carbon & Cost Overview",
        "tags": ["carbon", "cost", "sustainability"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Total Power Consumption (Watts)",
            "type": "graph",
            "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "sum(kepler_container_joules_total)",
                "legendFormat": "Total Power"
              }
            ]
          },
          {
            "id": 2,
            "title": "Cost per Namespace",
            "type": "graph",
            "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "sum by (namespace) (opencost_cpu_cost + opencost_memory_cost)",
                "legendFormat": "{{ namespace }}"
              }
            ]
          },
          {
            "id": 3,
            "title": "Energy by Pod",
            "type": "table",
            "gridPos": {"x": 0, "y": 8, "w": 24, "h": 8},
            "targets": [
              {
                "expr": "topk(10, sum by (pod_name, namespace) (rate(kepler_container_joules_total[5m])))",
                "format": "table",
                "instant": true
              }
            ]
          }
        ]
      }
    }
