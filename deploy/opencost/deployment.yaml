apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencost
  namespace: opencost
  labels:
    app: opencost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencost
  template:
    metadata:
      labels:
        app: opencost
    spec:
      serviceAccountName: opencost
      containers:
        - name: opencost
          # Pin to specific version for reproducibility
          image: quay.io/kubecost1/kubecost-cost-model:v2.3.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9003
              name: http
          env:
            - name: PROMETHEUS_SERVER_ENDPOINT
              value: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
            # Demo API key - replace with your own for production use
            - name: CLOUD_PROVIDER_API_KEY
              value: "AIzaSyD29bGxmHAVEOBYtgd8sYM2uuzSB6ry4MI"
            - name: CLUSTER_ID
              value: "green-practitioner-toolkit"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
